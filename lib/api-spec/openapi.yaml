openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Public bot status
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/status/public:
    get:
      operationId: getPublicBotStatus
      tags: [bot]
      summary: Public bot status
      description: Returns the Discord bot state for websites and status displays
      responses:
        "200":
          description: Current bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBotStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicBotStatus:
      type: object
      properties:
        status:
          type: string
          enum: [online, maintenance, offline]
        checkedAt:
          type: string
          format: date-time
      required:
        - status
        - checkedAt

